name: Supabase keep-alive

# Prevents the Supabase Free Plan project from being paused for inactivity
# by running a harmless read-only SELECT every 3 days.
on:
  schedule:
    # 09:00 UTC on days 1, 4, 7, ... of each month (never more than 3 days apart).
    - cron: "0 9 */3 * *"
  workflow_dispatch:

# Least privilege: read-only access, only needed to check out the script.
permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Read-only query against Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out keep-alive script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Query public.site_settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash .github/scripts/supabase-keep-alive.sh
